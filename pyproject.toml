[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readwebform"
version = "0.3.0"
description = "A command-line utility for gathering structured user input through temporary web forms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Vlad Lasky", email = "github@vladlasky.com"}
]
keywords = ["cli", "form", "web", "input", "automation", "scripting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest", "cryptography>=41.0.0"]
dev = ["pytest", "cryptography>=41.0.0", "ruff", "pyright"]

[project.urls]
Homepage = "https://github.com/vlasky/readwebform"
Repository = "https://github.com/vlasky/readwebform"
Issues = "https://github.com/vlasky/readwebform/issues"

[project.scripts]
readwebform = "readwebform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readwebform = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLW"]
ignore = [
    "SIM105",  # try/except/pass is clearer than contextlib.suppress in cleanup code
    "SIM108",  # ternaries are not always clearer
    "RUF012",  # mutable class attributes are intentional on handler classes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011", "SIM117", "PLW1510", "RUF059", "RUF043"]
"demo/*" = ["E501"]  # embedded HTML/CSS template

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
